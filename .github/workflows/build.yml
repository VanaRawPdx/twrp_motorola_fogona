name: Build OrangeFox for Motorola G Play 2024 (fogona)

on:
  workflow_dispatch:
  push:
    branches:
      - twrp-12.1

jobs:
  build:
    name: Build TWRP Image
    runs-on: ubuntu-22.04
    env:
      TWRP_ROOT: /home/runner/OrangeFox
      DEVICE_TREE: /home/runner/OrangeFox/device/motorola/fogona
      PRODUCT_OUT: /home/runner/OrangeFox/out/target/product/fogona

    steps:
      - name: Clean Up Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo apt-get clean

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++-multilib gcc-multilib lib32ncurses5-dev lib32z1-dev \
            bison build-essential curl flex git git-core gnupg \
            liblz4-tool libncurses5 libxml2-utils lzop pngcrush \
            schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python3 python-is-python3 repo

      - name: Sync OrangeFox 12.1 Sources
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git clone --depth=1 https://gitlab.com/OrangeFox/sync.git /home/runner/OrangeFox_sync
          cd /home/runner/OrangeFox_sync
          ./orangefox_sync.sh --branch 12.1 --path "$TWRP_ROOT"

      - name: Clone Device Tree
        run: |
          git clone --depth=1 --branch twrp-12.1 --single-branch \
            https://github.com/VanaRawPdx/twrp_motorola_fogona.git \
            "$DEVICE_TREE"

      - name: Preflight Build Inputs and Output Paths
        run: |
          set -euo pipefail

          for makefile in \
            "$DEVICE_TREE/AndroidProducts.mk" \
            "$DEVICE_TREE/BoardConfig.mk" \
            "$DEVICE_TREE/twrp_fogona.mk"; do
            test -s "$makefile" || {
              echo "Missing expected makefile: $makefile" >&2
              exit 1
            }
          done

          grep -Fq '$(LOCAL_DIR)/twrp_fogona.mk' "$DEVICE_TREE/AndroidProducts.mk"
          grep -Fq 'twrp_fogona-eng' "$DEVICE_TREE/AndroidProducts.mk"
          grep -Fq '$(SRC_TARGET_DIR)/product/core_64_bit.mk' "$DEVICE_TREE/twrp_fogona.mk"
          grep -Fq 'PRODUCT_DEVICE := fogona' "$DEVICE_TREE/twrp_fogona.mk"
          test "$(git -C "$DEVICE_TREE" branch --show-current)" = "twrp-12.1"

          case "$PRODUCT_OUT" in
            "$TWRP_ROOT"/out/target/product/fogona) ;;
            *)
              echo "Unexpected product output directory: $PRODUCT_OUT" >&2
              exit 1
              ;;
          esac

          printf 'Expected build output: %s\n' \
            "$PRODUCT_OUT/recovery.img" \
            "$PRODUCT_OUT/boot.img"

      - name: Build OrangeFox Recovery
        run: |
          cd "$TWRP_ROOT"
          source build/envsetup.sh
          lunch twrp_fogona-eng
          mka recoveryimage -j$(nproc --all)

      - name: Verify Build Outputs
        run: |
          set -euo pipefail

          for image in recovery.img; do
            test -s "$PRODUCT_OUT/$image" || {
              echo "Missing expected build output: $PRODUCT_OUT/$image" >&2
              exit 1
            }
          done

      - name: Upload OrangeFox Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-fogona-Recovery
          path: |
            ${{ env.PRODUCT_OUT }}/recovery.img
          if-no-files-found: error

